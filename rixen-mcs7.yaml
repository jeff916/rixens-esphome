# =====================================================================
# Heat source - Furnace
# =====================================================================
  - platform: template
    name: Furnace
    id: furnace_id
    icon: mdi:fire
    optimistic: false
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - logger.log:
          format: "Turn furnace heat on"
          level: INFO
      - canbus.send: [0x03, 0x01, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0]
#      - delay: 10ms

    turn_off_action:
      - logger.log:
          format: "Turn furnace heat off"
          level: INFO
      - canbus.send: [0x03, 0x00, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0]
#      - delay: 10ms

# =====================================================================
# Heat source - Electric
# =====================================================================
  - platform: template
    name: Electric
    id: electric_id
    icon: mdi:flash
    optimistic: false
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - logger.log:
          format: "Turn electric heat on"
          level: INFO
      - canbus.send: [0x04, 0x01, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0]
#      - delay: 10ms
    turn_off_action:
      - logger.log:
          format: "Turn electric heat off"
          level: INFO
      - canbus.send: [0x04, 0x00, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0]
