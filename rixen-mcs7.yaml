      - clamp:
          min_value: -24.0
          max_value: 66.0
          ignore_out_of_range: true
      - sliding_window_moving_average:
          window_size: 60
          send_every: 5
          send_first_at: 1

  - platform: template
    name: Relative Humidity
    unit_of_measurement: "%"
    device_class: humidity
    icon: mdi:water-percent
    id: relative_humidity
    filters:
      - delta: 0.1          # only send if value changed by 0.1°


