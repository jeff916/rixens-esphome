  - platform: template
    name: Ambient Temperature
    unit_of_measurement: °C
    device_class: temperature
    icon: mdi:thermometer
    id: ambient_temperature
# 30 minute filter updated every 30 seconds and sent every 2.5 minutes
# 1 minute filter updated every 1 seconds and sent every 25 seconds
#    update_interval: 30s
