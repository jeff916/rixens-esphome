  - platform: template
    name: Heater Fuel
    device_class: frequency
    unit_of_measurement: Hz
    icon: mdi:sine-wave
    id: heater_fuel
    entity_category: "diagnostic"
    accuracy_decimals: 1
    filters:
      - round: 1
      - delta: 0.1          # only send if value changed by 0.1

  # Rixens Voltage
  - platform: template
    name: Voltage
    device_class: voltage
    unit_of_measurement: V
    icon: mdi:lightning-bolt-outline
    id: voltage
    entity_category: "diagnostic"
    accuracy_decimals: 1
    filters:
      - round: 1
      - delta: 0.1          # only send if value changed by 0.1

  # Rixens Furnace Status Code
  #  0 = off
  # 10 = Initial Cold Start
  # 20 = Running
  # 30 = After Run to Shutdown
  - platform: template
    name: Furnace Status Code
    icon: mdi:comment-alert
    id: furnace_status_code
    state_class: measurement
    entity_category: "diagnostic"
    filters:
      - delta: 1            # only send if value changed by 1
    on_value:
      then:
        - lambda: |-
            char buffer[30];
            int i = (int) x;
            if (i == 0) sprintf(buffer, "Off");
            else if (i == 10) sprintf(buffer, "Initial Cold Start");
            else if (i == 12) sprintf(buffer, "Warm Start");
            else if (i == 13) sprintf(buffer, "Cold Blow");
            else if (i == 20) sprintf(buffer, "Running");
            else if (i == 30) sprintf(buffer, "After Run to Shutdown");
            else if (i == 31) sprintf(buffer, "After Run to Standby");
            else if (i == 40) sprintf(buffer, "Standby");
            else {
              sprintf(buffer, "Status: %d", i);
            };

            if (id(furnace_status).state != buffer) {
              id(furnace_status).publish_state(buffer);
            }
  # WiFi signal — useful for placement decisions
  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: "diagnostic"
    update_interval: 60s
# Free Heap
  - platform: template
    name: "Free Heap"
    id: free_heap
    unit_of_measurement: "B"
    state_class: measurement
    entity_category: "diagnostic"
    update_interval: 30s
    lambda: |-
      return ESP.getFreeHeap();
    filters:
      - delta: 1024

