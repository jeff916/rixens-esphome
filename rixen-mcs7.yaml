    icon: mdi:heat-wave
    entity_category: "diagnostic"

  - platform: template
    name: "Fan On"
    id: FanOn_id
    icon: mdi:fan
    entity_category: "diagnostic"

  # Rixens Furnace source
  - platform: template
    name: MCS7 Furnace Selected
    id: mcs7_furnace_selected_id
    icon: mdi:fire
    entity_category: "diagnostic"

  # Rixens Electric source 
  - platform: template
    name: MCS7 Electric Selected
    id: mcs7_electric_selected_id
    icon: mdi:flash
    entity_category: "diagnostic"

  # Rixens call for Hotwater
  - platform: template
    name: MCS7 Hotwater Selected
    id: mcs7_hotwater_selected_id
    icon: mdi:water-thermometer
    entity_category: "diagnostic"

text_sensor:
  - platform: template
    id: furnace_status
    name: "Furnace Status"

  - platform: template
    id: Runtime
    name: Run Time
    icon: mdi:fan
    entity_category: "diagnostic"
    lambda: |-
      int total_minutes = (int)id(heater_runtime).state;
      int hours = total_minutes / 60;
      int minutes = total_minutes % 60;
      
      char buf[16];
      snprintf(buf, sizeof(buf), "%02dh:%02dm", hours, minutes);
      return {buf};
    update_interval: never

